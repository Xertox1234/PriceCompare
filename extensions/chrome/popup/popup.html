<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PriceCompare Extension</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <div class="popup-header">
      <h1 class="popup-title">PriceCompare</h1>
      <div class="popup-version">v1.0.0</div>
    </div>

    <!-- Status -->
    <div class="popup-status" id="status">
      <div class="status-indicator" id="status-indicator"></div>
      <span id="status-text">Ready</span>
    </div>

    <!-- Stats -->
    <div class="popup-stats" id="stats">
      <div class="stat-item">
        <div class="stat-value" id="products-viewed">0</div>
        <div class="stat-label">Products Viewed</div>
      </div>
      <div class="stat-item">
        <div class="stat-value" id="charts-displayed">0</div>
        <div class="stat-label">Charts Displayed</div>
      </div>
      <div class="stat-item">
        <div class="stat-value" id="alerts-created">0</div>
        <div class="stat-label">Alerts Created</div>
      </div>
    </div>

    <!-- Recent Products -->
    <div class="popup-section">
      <h3 class="section-title">Recent Products</h3>
      <div class="recent-products" id="recent-products">
        <p class="empty-state">No recent products</p>
      </div>
    </div>

    <!-- Actions -->
    <div class="popup-actions">
      <button class="action-btn primary" id="open-dashboard">
        <span>Open Dashboard</span>
      </button>
      <button class="action-btn" id="clear-cache">
        <span>Clear Cache</span>
      </button>
    </div>

    <!-- Settings Toggle -->
    <div class="popup-settings">
      <div class="setting-item">
        <label class="setting-label">
          <input type="checkbox" id="enabled-toggle" checked>
          <span>Enable Extension</span>
        </label>
      </div>
      <div class="setting-item">
        <label class="setting-label">
          <input type="checkbox" id="auto-show-toggle" checked>
          <span>Auto-show on Product Pages</span>
        </label>
      </div>
    </div>

    <!-- Footer -->
    <div class="popup-footer">
      <a href="http://localhost:3000" target="_blank" class="footer-link">Visit PriceCompare</a>
      <span class="footer-separator">•</span>
      <a href="#" id="settings-link" class="footer-link">Settings</a>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
