name: E2E Tests

on:
  pull_request:
    paths:
      - 'e2e/**'
      - 'client/**'
      - 'server/**'
      - 'shared/**'
      - 'playwright.config.ts'
      - 'package.json'
      - 'package-lock.json'
  push:
    branches:
      - main
      - add_scraping

jobs:
  e2e:
    name: E2E Tests (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: pricecompare_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 3
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        env:
          # Database configuration
          DATABASE_URL: postgresql://test:test@localhost:5432/pricecompare_test
          DATABASE_NAME: pricecompare_test
          DATABASE_USER: test
          DATABASE_PASSWORD: test
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432

          # Redis configuration
          REDIS_URL: redis://localhost:6379

          # Test mode
          NODE_ENV: test

          # Security secrets (test values)
          ENCRYPTION_KEY: ${{ secrets.TEST_ENCRYPTION_KEY || 'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa' }}
          SESSION_SECRET: ${{ secrets.TEST_SESSION_SECRET || 'test-session-secret-min-32-chars-long' }}
          CSRF_SECRET: ${{ secrets.TEST_CSRF_SECRET || 'test-csrf-secret-min-32-chars' }}

          # Playwright configuration
          PLAYWRIGHT_TEST_BASE_URL: http://localhost:5001
          CI: true
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 7

      - name: Upload screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: test-results/**/*.png
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload videos
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: videos
          path: test-results/**/*.webm
          retention-days: 7
          if-no-files-found: ignore

      - name: Comment PR with test results
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            // Try to read test results summary
            let summary = '❌ E2E tests failed. Check artifacts for details.';

            try {
              const junitPath = path.join(process.env.GITHUB_WORKSPACE, 'test-results', 'junit.xml');
              if (fs.existsSync(junitPath)) {
                summary += '\n\n📊 Test artifacts uploaded:\n';
                summary += '- Playwright HTML Report\n';
                summary += '- Screenshots (on failure)\n';
                summary += '- Videos (on failure)\n';
                summary += '- JUnit XML results';
              }
            } catch (error) {
              console.log('Could not read test results:', error);
            }

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summary
            });
