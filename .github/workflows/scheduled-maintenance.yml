name: Scheduled Maintenance

on:
  # Weekly maintenance (Sunday at 2 AM UTC)
  schedule:
    - cron: '0 2 * * 0'

  # Allow manual trigger
  workflow_dispatch:

jobs:
  security-audit:
    name: Weekly Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run comprehensive security scan
        run: npm run security:scan

      - name: Generate security report
        run: |
          echo "## 🔒 Weekly Security Audit Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Date:** $(date)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Run npm audit and capture output
          npm audit --json > audit-report.json || true

          TOTAL=$(cat audit-report.json | jq '.metadata.vulnerabilities.total // 0')
          CRITICAL=$(cat audit-report.json | jq '.metadata.vulnerabilities.critical // 0')
          HIGH=$(cat audit-report.json | jq '.metadata.vulnerabilities.high // 0')
          MODERATE=$(cat audit-report.json | jq '.metadata.vulnerabilities.moderate // 0')
          LOW=$(cat audit-report.json | jq '.metadata.vulnerabilities.low // 0')

          echo "### Vulnerability Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Severity | Count |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Critical | $CRITICAL |" >> $GITHUB_STEP_SUMMARY
          echo "| High | $HIGH |" >> $GITHUB_STEP_SUMMARY
          echo "| Moderate | $MODERATE |" >> $GITHUB_STEP_SUMMARY
          echo "| Low | $LOW |" >> $GITHUB_STEP_SUMMARY
          echo "| **Total** | **$TOTAL** |" >> $GITHUB_STEP_SUMMARY

      - name: Create issue if vulnerabilities found
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const audit = JSON.parse(fs.readFileSync('audit-report.json', 'utf8'));

            const critical = audit.metadata?.vulnerabilities?.critical || 0;
            const high = audit.metadata?.vulnerabilities?.high || 0;

            if (critical > 0 || high > 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `🔒 Security Alert: ${critical} critical, ${high} high vulnerabilities detected`,
                body: `## Security Vulnerabilities Detected

**Weekly security scan on ${new Date().toLocaleDateString()} found:**

- 🔴 Critical: ${critical}
- 🟠 High: ${high}

**Action Required:**
Run \`npm audit fix\` to automatically fix vulnerabilities, or review manually:

\`\`\`bash
npm audit
npm audit fix
npm audit fix --force  # Use with caution - may break dependencies
\`\`\`

**See full report:** https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}

Labels: security, automated`,
                labels: ['security', 'automated', 'priority-high']
              });
            }

  dependency-updates-check:
    name: Check for Outdated Dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Check for outdated packages
        run: |
          echo "Checking for outdated packages..."
          npm outdated --json > outdated.json || true

          echo "## 📦 Outdated Dependencies Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Parse outdated packages
          OUTDATED_COUNT=$(cat outdated.json | jq '. | length')

          if [ "$OUTDATED_COUNT" -eq 0 ]; then
            echo "✅ All dependencies are up to date!" >> $GITHUB_STEP_SUMMARY
          else
            echo "Found $OUTDATED_COUNT outdated packages:" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Package | Current | Wanted | Latest |" >> $GITHUB_STEP_SUMMARY
            echo "|---------|---------|--------|--------|" >> $GITHUB_STEP_SUMMARY

            cat outdated.json | jq -r 'to_entries[] | "| \(.key) | \(.value.current) | \(.value.wanted) | \(.value.latest) |"' >> $GITHUB_STEP_SUMMARY
          fi

  test-coverage-report:
    name: Generate Coverage Report
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: ankane/pgvector:latest
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate coverage report
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379
          NODE_ENV: test
          SESSION_SECRET: test-secret
          CSRF_SECRET: test-csrf-secret
        run: npm run test:coverage

      - name: Calculate coverage metrics
        run: |
          echo "## 📊 Test Coverage Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Parse coverage summary
          if [ -f "coverage/coverage-summary.json" ]; then
            TOTAL_COVERAGE=$(cat coverage/coverage-summary.json | jq '.total.lines.pct')
            TOTAL_STATEMENTS=$(cat coverage/coverage-summary.json | jq '.total.statements.pct')
            TOTAL_BRANCHES=$(cat coverage/coverage-summary.json | jq '.total.branches.pct')
            TOTAL_FUNCTIONS=$(cat coverage/coverage-summary.json | jq '.total.functions.pct')

            echo "| Metric | Coverage |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|----------|" >> $GITHUB_STEP_SUMMARY
            echo "| Lines | ${TOTAL_COVERAGE}% |" >> $GITHUB_STEP_SUMMARY
            echo "| Statements | ${TOTAL_STATEMENTS}% |" >> $GITHUB_STEP_SUMMARY
            echo "| Branches | ${TOTAL_BRANCHES}% |" >> $GITHUB_STEP_SUMMARY
            echo "| Functions | ${TOTAL_FUNCTIONS}% |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY

            # Check if coverage meets threshold
            if (( $(echo "$TOTAL_COVERAGE < 60" | bc -l) )); then
              echo "⚠️ **Warning:** Coverage below 60% threshold" >> $GITHUB_STEP_SUMMARY
            else
              echo "✅ Coverage meets minimum threshold" >> $GITHUB_STEP_SUMMARY
            fi
          fi

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30

  database-health-check:
    name: Database Schema Health Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: ankane/pgvector:latest
        env:
          POSTGRES_DB: health_check_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Setup database
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/health_check_db
        run: |
          echo "Creating base schema..."
          npm run db:push
          echo "Running migrations..."
          npm run migrate

      - name: Verify foreign key constraints
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/health_check_db
        run: |
          echo "Checking foreign key cascade rules..."

          MISSING_CASCADE=$(psql $DATABASE_URL -t -c "
            SELECT
              tc.table_name || '.' || kcu.column_name AS foreign_key,
              'Missing cascade rule' AS issue
            FROM information_schema.table_constraints AS tc
            JOIN information_schema.key_column_usage AS kcu
              ON tc.constraint_name = kcu.constraint_name
            JOIN information_schema.referential_constraints AS rc
              ON rc.constraint_name = tc.constraint_name
            WHERE tc.constraint_type = 'FOREIGN KEY'
              AND rc.delete_rule IS NULL
              AND tc.table_schema = 'public';
          ")

          echo "## 🗄️ Database Health Check" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ ! -z "$MISSING_CASCADE" ]; then
            echo "⚠️ **Issues Found:**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            echo "$MISSING_CASCADE" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ All foreign keys have cascade rules" >> $GITHUB_STEP_SUMMARY
          fi

  maintenance-summary:
    name: Maintenance Summary
    runs-on: ubuntu-latest
    needs: [security-audit, dependency-updates-check, test-coverage-report, database-health-check]
    if: always()

    steps:
      - name: Generate summary
        run: |
          echo "## 🔧 Weekly Maintenance Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Date:** $(date)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Task | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Security Audit | ${{ needs.security-audit.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Dependency Check | ${{ needs.dependency-updates-check.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Coverage Report | ${{ needs.test-coverage-report.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Database Health | ${{ needs.database-health-check.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Next scheduled run: $(date -d 'next sunday 02:00' 2>/dev/null || date -v+7d -v2H -v0M -v0S 2>/dev/null || echo 'Next Sunday at 02:00 UTC')" >> $GITHUB_STEP_SUMMARY
