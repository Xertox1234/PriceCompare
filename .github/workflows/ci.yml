name: CI

# This workflow runs on pushes to main/develop branches (post-merge).
# For PRs, use pr-validation.yml (tests) and e2e-tests.yml (Playwright).
on:
  push:
    branches: [main, develop]
  workflow_dispatch:  # Allow manual triggering

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Primary job: Run all quality checks and tests
  test:
    name: Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: ankane/pgvector:latest
        env:
          POSTGRES_DB: pricecompare_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: ESLint
        run: npm run lint --max-warnings 0

      - name: Setup environment
        run: |
          echo "DATABASE_URL=postgresql://postgres:postgres@localhost:5432/pricecompare_test" >> $GITHUB_ENV
          echo "REDIS_URL=redis://localhost:6379" >> $GITHUB_ENV
          echo "SESSION_SECRET=$(openssl rand -base64 32)" >> $GITHUB_ENV
          echo "CSRF_SECRET=$(openssl rand -base64 32)" >> $GITHUB_ENV
          echo "ENCRYPTION_KEY=$(openssl rand -hex 32)" >> $GITHUB_ENV
          echo "NODE_ENV=test" >> $GITHUB_ENV

      - name: Setup pgvector extension
        run: PGPASSWORD=postgres psql -h localhost -U postgres -d pricecompare_test -c "CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Run database migrations
        run: |
          npm run db:push
          npm run migrate

      - name: Validate schema synchronization
        run: npm run validate:schema-sync
        # Ensures E2E test cleanup logic (e2e/helpers.ts) matches schema (shared/schema.ts)
        # Prevents test failures from missing tables in TRUNCATE statement

      - name: Run tests with coverage
        run: npm run test:ci

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: ./coverage/coverage-final.json
          flags: unittests
          fail_ci_if_error: false

      - name: Build application
        run: npm run build
        env:
          NODE_ENV: production

      - name: Archive build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  # E2E tests for main branch only (smoke test after merge)
  e2e:
    name: E2E Smoke Test
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 20

    services:
      postgres:
        image: ankane/pgvector:latest
        env:
          POSTGRES_DB: pricecompare_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Setup environment
        run: |
          echo "DATABASE_URL=postgresql://postgres:postgres@localhost:5432/pricecompare_test" >> $GITHUB_ENV
          echo "REDIS_URL=redis://localhost:6379" >> $GITHUB_ENV
          echo "SESSION_SECRET=$(openssl rand -base64 32)" >> $GITHUB_ENV
          echo "CSRF_SECRET=$(openssl rand -base64 32)" >> $GITHUB_ENV
          echo "ENCRYPTION_KEY=$(openssl rand -hex 32)" >> $GITHUB_ENV
          echo "NODE_ENV=test" >> $GITHUB_ENV

      - name: Setup database
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d pricecompare_test -c "CREATE EXTENSION IF NOT EXISTS vector;"
          npm run db:push
          npm run migrate

      - name: Validate schema synchronization
        run: npm run validate:schema-sync
        # Ensures E2E test cleanup logic matches database schema

      - name: Build application
        run: npm run build

      - name: Run E2E smoke tests
        run: npx playwright test --grep "@smoke" || npx playwright test --project=chromium --workers=1
        # Try smoke tests first, fall back to all chromium tests if no @smoke tag exists

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
