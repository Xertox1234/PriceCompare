name: Database Backup

on:
  # Daily backup at 2 AM UTC
  schedule:
    - cron: '0 2 * * *'

  # Allow manual trigger for testing or immediate backup
  workflow_dispatch:
    inputs:
      backup_type:
        description: 'Type of backup to perform'
        required: false
        default: 'daily'
        type: choice
        options:
          - daily
          - full
          - schema-only

env:
  BACKUP_RETENTION_DAYS: 30
  S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}

jobs:
  backup:
    name: Create Database Backup
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client-15

      - name: Set backup filename
        id: backup-info
        run: |
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          BACKUP_TYPE=${{ github.event.inputs.backup_type || 'daily' }}
          BACKUP_FILE="pricecompare-${BACKUP_TYPE}-${TIMESTAMP}.dump"
          BACKUP_HASH_FILE="${BACKUP_FILE}.sha256"

          echo "timestamp=$TIMESTAMP" >> $GITHUB_OUTPUT
          echo "backup_file=$BACKUP_FILE" >> $GITHUB_OUTPUT
          echo "backup_hash_file=$BACKUP_HASH_FILE" >> $GITHUB_OUTPUT
          echo "backup_type=$BACKUP_TYPE" >> $GITHUB_OUTPUT

          echo "## 🗄️ Database Backup" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Type:** ${BACKUP_TYPE}" >> $GITHUB_STEP_SUMMARY
          echo "**Timestamp:** ${TIMESTAMP}" >> $GITHUB_STEP_SUMMARY
          echo "**Filename:** ${BACKUP_FILE}" >> $GITHUB_STEP_SUMMARY

      - name: Create database backup
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          BACKUP_FILE="${{ steps.backup-info.outputs.backup_file }}"
          BACKUP_TYPE="${{ steps.backup-info.outputs.backup_type }}"

          echo "Creating ${BACKUP_TYPE} backup..."

          # Set pg_dump options based on backup type
          DUMP_OPTIONS="-Fc --verbose"

          if [ "$BACKUP_TYPE" = "schema-only" ]; then
            DUMP_OPTIONS="$DUMP_OPTIONS --schema-only"
          fi

          # Create the backup
          pg_dump $DATABASE_URL $DUMP_OPTIONS > "$BACKUP_FILE"

          # Verify the backup was created
          if [ ! -f "$BACKUP_FILE" ]; then
            echo "::error::Backup file was not created"
            exit 1
          fi

          # Get backup size
          BACKUP_SIZE=$(ls -lh "$BACKUP_FILE" | awk '{print $5}')
          echo "Backup created: $BACKUP_FILE ($BACKUP_SIZE)"

          # Generate SHA256 checksum
          sha256sum "$BACKUP_FILE" > "${{ steps.backup-info.outputs.backup_hash_file }}"

          echo "**Size:** $BACKUP_SIZE" >> $GITHUB_STEP_SUMMARY

      - name: Verify backup integrity
        run: |
          BACKUP_FILE="${{ steps.backup-info.outputs.backup_file }}"

          echo "Verifying backup integrity..."

          # Check the backup file is a valid PostgreSQL custom format
          pg_restore --list "$BACKUP_FILE" > /dev/null

          if [ $? -eq 0 ]; then
            echo "✅ Backup integrity verified"
            echo "**Integrity Check:** ✅ Passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "::error::Backup integrity check failed"
            echo "**Integrity Check:** ❌ Failed" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

          # Count tables and functions in backup
          TABLE_COUNT=$(pg_restore --list "$BACKUP_FILE" | grep -c "TABLE" || echo "0")
          echo "Tables in backup: $TABLE_COUNT"
          echo "**Tables:** $TABLE_COUNT" >> $GITHUB_STEP_SUMMARY

      - name: Upload to S3
        if: env.S3_BUCKET != ''
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
        run: |
          BACKUP_FILE="${{ steps.backup-info.outputs.backup_file }}"
          BACKUP_HASH_FILE="${{ steps.backup-info.outputs.backup_hash_file }}"
          BACKUP_TYPE="${{ steps.backup-info.outputs.backup_type }}"

          echo "Uploading backup to S3..."

          # Upload backup file
          aws s3 cp "$BACKUP_FILE" "s3://${S3_BUCKET}/${BACKUP_TYPE}/$BACKUP_FILE"

          # Upload checksum file
          aws s3 cp "$BACKUP_HASH_FILE" "s3://${S3_BUCKET}/${BACKUP_TYPE}/$BACKUP_HASH_FILE"

          echo "✅ Backup uploaded to s3://${S3_BUCKET}/${BACKUP_TYPE}/"
          echo "**S3 Location:** s3://${S3_BUCKET}/${BACKUP_TYPE}/${BACKUP_FILE}" >> $GITHUB_STEP_SUMMARY

      - name: Upload backup as artifact
        uses: actions/upload-artifact@v4
        with:
          name: database-backup-${{ steps.backup-info.outputs.timestamp }}
          path: |
            ${{ steps.backup-info.outputs.backup_file }}
            ${{ steps.backup-info.outputs.backup_hash_file }}
          retention-days: 7

      - name: Cleanup old S3 backups
        if: env.S3_BUCKET != ''
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
        run: |
          BACKUP_TYPE="${{ steps.backup-info.outputs.backup_type }}"
          CUTOFF_DATE=$(date -d "${BACKUP_RETENTION_DAYS} days ago" +%Y%m%d 2>/dev/null || \
                        date -v-${BACKUP_RETENTION_DAYS}d +%Y%m%d)

          echo "Cleaning up backups older than ${BACKUP_RETENTION_DAYS} days (before ${CUTOFF_DATE})..."

          # List and filter old backups
          aws s3 ls "s3://${S3_BUCKET}/${BACKUP_TYPE}/" | while read -r line; do
            FILE_NAME=$(echo "$line" | awk '{print $4}')
            if [ -z "$FILE_NAME" ]; then
              continue
            fi

            # Extract date from filename (format: pricecompare-type-YYYYMMDD-HHMMSS.dump)
            FILE_DATE=$(echo "$FILE_NAME" | grep -oP '\d{8}' | head -1)

            if [ -n "$FILE_DATE" ] && [ "$FILE_DATE" -lt "$CUTOFF_DATE" ]; then
              echo "Deleting old backup: $FILE_NAME"
              aws s3 rm "s3://${S3_BUCKET}/${BACKUP_TYPE}/$FILE_NAME"
            fi
          done

          echo "✅ Old backups cleaned up"

      - name: Generate backup report
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "### Backup Retention Policy" >> $GITHUB_STEP_SUMMARY
          echo "- **Retention Period:** ${BACKUP_RETENTION_DAYS} days" >> $GITHUB_STEP_SUMMARY
          echo "- **Schedule:** Daily at 02:00 UTC" >> $GITHUB_STEP_SUMMARY
          echo "- **Artifact Retention:** 7 days (GitHub)" >> $GITHUB_STEP_SUMMARY

  notify-on-failure:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: backup
    if: failure()

    steps:
      - name: Create failure issue
        uses: actions/github-script@v7
        with:
          script: |
            const title = `🚨 Database Backup Failed - ${new Date().toISOString().split('T')[0]}`;

            // Check if issue already exists today
            const existingIssues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'backup-failure',
              per_page: 10
            });

            const todayIssue = existingIssues.data.find(issue =>
              issue.title.includes(new Date().toISOString().split('T')[0])
            );

            if (todayIssue) {
              // Add comment to existing issue
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: todayIssue.number,
                body: `⚠️ Backup attempt failed again at ${new Date().toISOString()}\n\nSee [workflow run](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) for details.`
              });
            } else {
              // Create new issue
              const body = [
                '## 🚨 Database Backup Failed',
                '',
                '**Date:** ' + new Date().toISOString(),
                '**Workflow Run:** https://github.com/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId,
                '',
                '### Immediate Action Required',
                '',
                '1. Check the [workflow logs](https://github.com/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId + ') for error details',
                '2. Verify `DATABASE_URL` secret is correctly configured',
                '3. Check database connectivity',
                '4. Run a manual backup if needed:',
                '   - Go to Actions → Database Backup → Run workflow',
                '',
                '### Risk Assessment',
                '',
                '⚠️ **Without working backups, data recovery is NOT possible in case of failure.**',
                '',
                'Priority: **CRITICAL**',
                '',
                '---',
                '*This issue was automatically created by the backup workflow.*'
              ].join('\n');

              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['backup-failure', 'critical', 'automated', 'infrastructure']
              });
            }

      - name: Send Slack notification (if configured)
        if: ${{ secrets.SLACK_WEBHOOK_URL != '' }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          curl -X POST "$SLACK_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d '{
              "text": "🚨 *Database Backup Failed*",
              "attachments": [{
                "color": "danger",
                "fields": [
                  {"title": "Repository", "value": "${{ github.repository }}", "short": true},
                  {"title": "Run ID", "value": "${{ github.run_id }}", "short": true}
                ],
                "actions": [{
                  "type": "button",
                  "text": "View Workflow",
                  "url": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                }]
              }]
            }'

  weekly-integrity-check:
    name: Weekly Backup Integrity Check
    runs-on: ubuntu-latest
    # Only run on Sundays (same as scheduled-maintenance.yml)
    if: github.event.schedule == '0 2 * * 0' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Check recent backup exists
        if: env.S3_BUCKET != ''
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
        run: |
          echo "## 📋 Weekly Backup Integrity Check" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Get latest backup
          LATEST_BACKUP=$(aws s3 ls "s3://${S3_BUCKET}/daily/" | sort | tail -1 | awk '{print $4}')

          if [ -z "$LATEST_BACKUP" ]; then
            echo "::error::No backups found in S3"
            echo "❌ **No backups found!**" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

          # Extract date from filename
          BACKUP_DATE=$(echo "$LATEST_BACKUP" | grep -oP '\d{8}' | head -1)
          TODAY=$(date +%Y%m%d)
          DAYS_OLD=$(( ($(date -d "$TODAY" +%s) - $(date -d "$BACKUP_DATE" +%s)) / 86400 ))

          echo "**Latest Backup:** $LATEST_BACKUP" >> $GITHUB_STEP_SUMMARY
          echo "**Backup Age:** $DAYS_OLD days" >> $GITHUB_STEP_SUMMARY

          if [ "$DAYS_OLD" -gt 1 ]; then
            echo "::warning::Latest backup is more than 1 day old"
            echo "⚠️ **Warning:** Backup is $DAYS_OLD days old" >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ **Backup is current**" >> $GITHUB_STEP_SUMMARY
          fi

          # Count total backups
          BACKUP_COUNT=$(aws s3 ls "s3://${S3_BUCKET}/daily/" | wc -l)
          echo "**Total Backups in S3:** $BACKUP_COUNT" >> $GITHUB_STEP_SUMMARY
