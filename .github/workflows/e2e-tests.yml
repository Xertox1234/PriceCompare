name: E2E Tests

on:
  pull_request:
    branches: [main, develop, add_scraping]
    types: [opened, synchronize, reopened]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - 'LICENSE'
      - '.gitignore'

  # Allow manual trigger
  workflow_dispatch:
    inputs:
      shard_count:
        description: 'Number of Playwright shards (job-level parallelism; each shard runs with --workers=1)'
        required: false
        default: '4'
        type: choice
        options:
          - '2'
          - '4'
          - '6'
          - '8'

# Cancel in-progress runs for the same PR
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  e2e-tests:
    name: E2E Tests (Chromium, shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'pull_request'

    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    services:
      postgres:
        image: ankane/pgvector:latest
        env:
          POSTGRES_DB: e2e_test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Setup database
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/e2e_test_db
          NODE_ENV: test
        run: |
          echo "Installing pgvector extension..."
          PGPASSWORD=postgres psql -h localhost -U postgres -d e2e_test_db -c "CREATE EXTENSION IF NOT EXISTS vector;"
          echo "Creating base schema..."
          npm run db:push
          echo "Running migrations..."
          npm run migrate

      - name: Validate schema synchronization
        run: npm run validate:schema-sync
        # CRITICAL: Validates E2E cleanup logic (e2e/helpers.ts TRUNCATE) matches schema
        # Prevents test failures from missing tables (see TODO_007 investigation)

      - name: Build application
        run: npm run build

      - name: Generate runtime secrets
        run: |
          # Generate secure random secrets using openssl (avoids escaping issues with node -e)
          echo "SESSION_SECRET=$(openssl rand -base64 32)" >> $GITHUB_ENV
          echo "CSRF_SECRET=$(openssl rand -base64 32)" >> $GITHUB_ENV
          # Also generate ENCRYPTION_KEY (64 hex chars = 32 bytes for AES-256)
          echo "ENCRYPTION_KEY=$(openssl rand -hex 32)" >> $GITHUB_ENV
          # Generate DISCOURSE_SSO_SECRET (required by env-validation)
          echo "DISCOURSE_SSO_SECRET=$(openssl rand -base64 32)" >> $GITHUB_ENV

      - name: Run E2E tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/e2e_test_db
          REDIS_URL: redis://localhost:6379
          NODE_ENV: test
          PLAYWRIGHT_TEST_BASE_URL: http://localhost:5000
          CI: true
        run: |
          # Start server in background
          npm start &
          SERVER_PID=$!
          
          # Wait for server to be ready
          echo "Waiting for server to start..."
          timeout 60 bash -c 'until curl -f http://localhost:5000 > /dev/null 2>&1; do sleep 2; done' || {
            echo "Server failed to start"
            kill $SERVER_PID 2>/dev/null || true
            exit 1
          }
          
          echo "Server is ready, running E2E tests..."
          
          # Run Playwright tests
          npm run test:e2e -- --shard=${{ matrix.shard }}/4 --workers=1 || TEST_EXIT_CODE=$?
          
          # Cleanup
          kill $SERVER_PID 2>/dev/null || true
          
          # Exit with test result
          exit ${TEST_EXIT_CODE:-0}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-shard-${{ matrix.shard }}-of-4
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload JUnit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-junit-shard-${{ matrix.shard }}-of-4
          path: test-results/junit.xml
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload test videos
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-videos-shard-${{ matrix.shard }}-of-4
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Comment PR with test results
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const body = [
              '## ❌ E2E Tests Failed',
              '',
              'Some end-to-end tests failed. Please review the test report.',
              '',
              '**View Details:**',
              `- [Test Report](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              '- Test videos and screenshots are available in the artifacts',
              '',
              '**Common fixes:**',
              '- Check for console errors in browser',
              '- Verify API endpoints are working',
              '- Check for timing issues (use proper wait strategies)',
              '- Ensure test data is set up correctly',
              '',
              'Run tests locally: `npm run test:e2e:headed`'
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: body
            });

  e2e-tests-manual-matrix:
    name: E2E Manual Matrix
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    outputs:
      total: ${{ steps.set.outputs.total }}
      matrix: ${{ steps.set.outputs.matrix }}

    steps:
      - name: Compute shard matrix
        id: set
        run: |
          total='${{ github.event.inputs.shard_count }}'
          echo "total=$total" >> "$GITHUB_OUTPUT"
          shards=$(seq 1 "$total" | paste -sd, -)
          echo "matrix={\"shard\":[${shards}]}" >> "$GITHUB_OUTPUT"

  e2e-tests-manual:
    name: E2E Tests (Chromium, shard ${{ matrix.shard }}/${{ needs.e2e-tests-manual-matrix.outputs.total }}; manual)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'workflow_dispatch'
    needs: [e2e-tests-manual-matrix]

    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.e2e-tests-manual-matrix.outputs.matrix) }}

    services:
      postgres:
        image: ankane/pgvector:latest
        env:
          POSTGRES_DB: e2e_test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Setup database
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/e2e_test_db
          NODE_ENV: test
        run: |
          echo "Installing pgvector extension..."
          PGPASSWORD=postgres psql -h localhost -U postgres -d e2e_test_db -c "CREATE EXTENSION IF NOT EXISTS vector;"
          echo "Creating base schema..."
          npm run db:push
          echo "Running migrations..."
          npm run migrate

      - name: Validate schema synchronization
        run: npm run validate:schema-sync
        # CRITICAL: Validates E2E cleanup logic (e2e/helpers.ts TRUNCATE) matches schema
        # Prevents test failures from missing tables (see TODO_007 investigation)

      - name: Build application
        run: npm run build

      - name: Generate runtime secrets
        run: |
          # Generate secure random secrets using openssl (avoids escaping issues with node -e)
          echo "SESSION_SECRET=$(openssl rand -base64 32)" >> $GITHUB_ENV
          echo "CSRF_SECRET=$(openssl rand -base64 32)" >> $GITHUB_ENV
          # Also generate ENCRYPTION_KEY (64 hex chars = 32 bytes for AES-256)
          echo "ENCRYPTION_KEY=$(openssl rand -hex 32)" >> $GITHUB_ENV
          # Generate DISCOURSE_SSO_SECRET (required by env-validation)
          echo "DISCOURSE_SSO_SECRET=$(openssl rand -base64 32)" >> $GITHUB_ENV

      - name: Run E2E tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/e2e_test_db
          REDIS_URL: redis://localhost:6379
          NODE_ENV: test
          PLAYWRIGHT_TEST_BASE_URL: http://localhost:5000
          CI: true
        run: |
          # Start server in background
          npm start &
          SERVER_PID=$!

          # Wait for server to be ready
          echo "Waiting for server to start..."
          timeout 60 bash -c 'until curl -f http://localhost:5000 > /dev/null 2>&1; do sleep 2; done' || {
            echo "Server failed to start"
            kill $SERVER_PID 2>/dev/null || true
            exit 1
          }

          echo "Server is ready, running E2E tests..."

          # Run Playwright tests
          npm run test:e2e -- --shard=${{ matrix.shard }}/${{ needs.e2e-tests-manual-matrix.outputs.total }} --workers=1 || TEST_EXIT_CODE=$?

          # Cleanup
          kill $SERVER_PID 2>/dev/null || true

          # Exit with test result
          exit ${TEST_EXIT_CODE:-0}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-shard-${{ matrix.shard }}-of-${{ needs.e2e-tests-manual-matrix.outputs.total }}
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload JUnit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-junit-shard-${{ matrix.shard }}-of-${{ needs.e2e-tests-manual-matrix.outputs.total }}
          path: test-results/junit.xml
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload test videos
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-videos-shard-${{ matrix.shard }}-of-${{ needs.e2e-tests-manual-matrix.outputs.total }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  e2e-summary:
    name: E2E Test Summary
    runs-on: ubuntu-latest
    needs: [e2e-tests, e2e-tests-manual]
    if: always()

    steps:
      - name: Generate summary
        run: |
          echo "## 🎭 E2E Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Browser | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|--------|" >> $GITHUB_STEP_SUMMARY
          PR_RESULT='${{ needs.e2e-tests.result }}'
          MANUAL_RESULT='${{ needs.e2e-tests-manual.result }}'

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RESULT="$MANUAL_RESULT"
          else
            RESULT="$PR_RESULT"
          fi

          if [ "$RESULT" = "success" ]; then
            STATUS_TEXT="✅ Passed"
          else
            STATUS_TEXT="⚠️ Issues Found"
          fi

          echo "| Chromium | $STATUS_TEXT |" >> $GITHUB_STEP_SUMMARY
          
          if [ "$RESULT" != "success" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "⚠️ **E2E tests had issues. Review the test report and artifacts.**" >> $GITHUB_STEP_SUMMARY
            echo "ℹ️ E2E test failures are informational and don't block PR merges." >> $GITHUB_STEP_SUMMARY
            # Don't exit 1 - E2E failures are informational
          else
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "✅ **All E2E tests passed!**" >> $GITHUB_STEP_SUMMARY
          fi
