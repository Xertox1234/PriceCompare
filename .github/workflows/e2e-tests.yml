name: E2E Tests

on:
  pull_request:
    branches: [main, develop, add_scraping]
    types: [opened, synchronize, reopened]
  
  # Allow manual trigger
  workflow_dispatch:

# Cancel in-progress runs for the same PR
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  e2e-tests:
    name: E2E Tests (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: ankane/pgvector:latest
        env:
          POSTGRES_DB: e2e_test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Setup database
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/e2e_test_db
          NODE_ENV: test
        run: |
          echo "Installing pgvector extension..."
          PGPASSWORD=postgres psql -h localhost -U postgres -d e2e_test_db -c "CREATE EXTENSION IF NOT EXISTS vector;"
          echo "Creating base schema..."
          npm run db:push
          echo "Running migrations..."
          npm run migrate

      - name: Build application
        run: npm run build

      - name: Run E2E tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/e2e_test_db
          REDIS_URL: redis://localhost:6379
          NODE_ENV: test
          SESSION_SECRET: e2e-test-secret-key
          CSRF_SECRET: e2e-test-csrf-secret
          PLAYWRIGHT_TEST_BASE_URL: http://localhost:5000
          CI: true
        run: |
          # Start server in background
          npm start &
          SERVER_PID=$!
          
          # Wait for server to be ready
          echo "Waiting for server to start..."
          timeout 60 bash -c 'until curl -f http://localhost:5000 > /dev/null 2>&1; do sleep 2; done' || {
            echo "Server failed to start"
            kill $SERVER_PID 2>/dev/null || true
            exit 1
          }
          
          echo "Server is ready, running E2E tests..."
          
          # Run Playwright tests
          npm run test:e2e || TEST_EXIT_CODE=$?
          
          # Cleanup
          kill $SERVER_PID 2>/dev/null || true
          
          # Exit with test result
          exit ${TEST_EXIT_CODE:-0}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload test videos
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-videos
          path: test-results/
          retention-days: 7

      - name: Comment PR with test results
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const body = [
              '## ❌ E2E Tests Failed',
              '',
              'Some end-to-end tests failed. Please review the test report.',
              '',
              '**View Details:**',
              `- [Test Report](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              '- Test videos and screenshots are available in the artifacts',
              '',
              '**Common fixes:**',
              '- Check for console errors in browser',
              '- Verify API endpoints are working',
              '- Check for timing issues (use proper wait strategies)',
              '- Ensure test data is set up correctly',
              '',
              'Run tests locally: `npm run test:e2e:headed`'
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: body
            });

  e2e-summary:
    name: E2E Test Summary
    runs-on: ubuntu-latest
    needs: [e2e-tests]
    if: always()

    steps:
      - name: Generate summary
        run: |
          echo "## 🎭 E2E Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Browser | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Chromium | ${{ needs.e2e-tests.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ needs.e2e-tests.result }}" != "success" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "⚠️ **E2E tests failed. Review the test report and artifacts.**" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ **All E2E tests passed!**" >> $GITHUB_STEP_SUMMARY
