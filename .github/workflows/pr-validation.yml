name: Pull Request Validation

on:
  pull_request:
    branches: [main, develop, add_scraping]
    types: [opened, synchronize, reopened]

# Cancel in-progress runs for the same PR
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Job 1: Code Quality & Type Checking
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: TypeScript type checking
        run: npm run check
        continue-on-error: false

      - name: Check for console.log statements
        run: |
          echo "Checking for console.log in production code..."
          if git diff origin/${{ github.base_ref }}...HEAD --name-only | grep -E '\.(ts|tsx|js|jsx)$' | xargs grep -n 'console\.\(log\|debug\|info\)' | grep -v 'utils/logger' | grep -v '__tests__' | grep -v 'scripts/' || true; then
            echo "❌ Found console.log statements in production code"
            echo "Use the structured logger from utils/logger.ts instead"
            exit 1
          fi
          echo "✅ No console.log statements found"

      - name: Check for 'any' types
        run: |
          echo "Checking for 'any' types in new code..."
          if git diff origin/${{ github.base_ref }}...HEAD | grep "^+" | grep -E ": any|<any>|any\[\]" | grep -v "catch (error: any)" | grep -v "// any:" || true; then
            echo "⚠️ Found 'any' types in new code"
            echo "Consider using proper TypeScript types instead"
            exit 1
          fi
          echo "✅ No 'any' types found in new code"

  # Job 2: Automated Tests
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: ankane/pgvector:latest
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run test suite
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379
          NODE_ENV: test
          SESSION_SECRET: test-secret-key-for-ci
          CSRF_SECRET: test-csrf-secret-for-ci
        run: npm test

      - name: Generate coverage report
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379
          NODE_ENV: test
          SESSION_SECRET: test-secret-key-for-ci
          CSRF_SECRET: test-csrf-secret-for-ci
        run: npm run test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/coverage-final.json
          fail_ci_if_error: false

      - name: Comment coverage on PR
        uses: romeovs/lcov-reporter-action@v0.3.1
        if: github.event_name == 'pull_request'
        with:
          lcov-file: ./coverage/lcov.info
          github-token: ${{ secrets.GITHUB_TOKEN }}
          delete-old-comments: true

  # Job 3: Security Checks
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run npm audit
        run: npm run security:audit
        continue-on-error: false

      - name: Run security test suite
        env:
          DATABASE_URL: postgresql://localhost:5432/test_db
          NODE_ENV: test
        run: npm run test:security

  # Job 4: Build Verification
  build:
    name: Build Verification
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build frontend
        run: npm run build

      - name: Check build output
        run: |
          if [ ! -d "dist" ]; then
            echo "❌ Build directory not found"
            exit 1
          fi
          if [ ! -f "dist/index.js" ]; then
            echo "❌ Server bundle not found"
            exit 1
          fi
          echo "✅ Build successful"

      - name: Archive production artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  # Job 5: Pre-commit Hook Simulation
  pre-commit:
    name: Pre-commit Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Need full history for git diff

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Simulate pre-commit hook
        run: |
          echo "Running pre-commit checks..."

          # Get changed files
          CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -E '\.(ts|tsx|js|jsx)$' || true)

          if [ -z "$CHANGED_FILES" ]; then
            echo "✅ No TypeScript/JavaScript files changed"
            exit 0
          fi

          echo "Checking changed files:"
          echo "$CHANGED_FILES"

          ISSUES=0

          # Check for passwordHash exposure
          if echo "$CHANGED_FILES" | xargs git diff origin/${{ github.base_ref }}...HEAD | grep -E "^\+" | grep "passwordHash" | grep -v "NEVER" | grep -v "SECURITY:" | grep -v "//" | head -3; then
            echo "❌ BLOCKER: passwordHash exposure detected"
            ISSUES=$((ISSUES + 1))
          fi

          # Check for N+1 queries
          if echo "$CHANGED_FILES" | xargs git diff origin/${{ github.base_ref }}...HEAD | grep -E "^\+" | grep -E "for.*\(.*of|forEach\(" | grep -A 5 "await.*db\." | grep "await.*db\." | head -3; then
            echo "⚠️ WARNING: Potential N+1 query pattern detected"
          fi

          # Check for missing foreign key cascade rules
          if echo "$CHANGED_FILES" | grep "schema.ts" | xargs git diff origin/${{ github.base_ref }}...HEAD | grep -E "^\+" | grep "\.references\(" | grep -v "onDelete:" | head -3; then
            echo "❌ BLOCKER: Foreign key without cascade rule"
            ISSUES=$((ISSUES + 1))
          fi

          # Check for hardcoded secrets
          if echo "$CHANGED_FILES" | xargs git diff origin/${{ github.base_ref }}...HEAD | grep -E "^\+" | grep -iE "(api_key|apikey|password|secret|token).*=.*['\"][a-zA-Z0-9]{16,}" | grep -v "process.env" | grep -v "TODO" | head -3; then
            echo "❌ BLOCKER: Potential hardcoded secret detected"
            ISSUES=$((ISSUES + 1))
          fi

          if [ $ISSUES -gt 0 ]; then
            echo ""
            echo "❌ Pre-commit checks failed with $ISSUES critical issues"
            exit 1
          fi

          echo "✅ All pre-commit checks passed"

  # Final: All Checks Status
  # Note: E2E tests run in a separate workflow (e2e-tests.yml)
  ci-success:
    name: All Checks Passed
    runs-on: ubuntu-latest
    needs: [quality, test, security, build, pre-commit]
    if: always()

    steps:
      - name: Check all jobs
        run: |
          if [ "${{ needs.quality.result }}" != "success" ] || \
             [ "${{ needs.test.result }}" != "success" ] || \
             [ "${{ needs.security.result }}" != "success" ] || \
             [ "${{ needs.build.result }}" != "success" ] || \
             [ "${{ needs.pre-commit.result }}" != "success" ]; then
            echo "❌ One or more checks failed"
            exit 1
          fi
          echo "✅ All CI checks passed!"
          echo ""
          echo "ℹ️ E2E tests run in parallel - check the E2E Tests workflow"
