name: Pull Request Validation

on:
  pull_request:
    branches: [main, develop, add_scraping]
    types: [opened, synchronize, reopened]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - 'LICENSE'
      - '.gitignore'

# Cancel in-progress runs for the same PR
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Job 1: Code Quality & Type Checking
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: ESLint
        run: |
          if ! npm run lint -- --max-warnings 250; then
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "❌ ESLint Warning Threshold Exceeded"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo ""
            CURRENT=$(npm run lint 2>&1 | grep "problems" | awk '{print $1}')
            echo "📊 Current warnings: $CURRENT"
            echo "⚠️  Maximum allowed: 250"
            echo "🎯 Expected (intentional): 200"
            echo ""
            echo "🔍 Breakdown of intentional warnings:"
            echo "   • server/storage.ts: 192 (MemStorage interface compliance)"
            echo "   • server/config/redis.ts: 4 (InMemoryRedis interface compliance)"
            echo "   • server/middleware/redis-cache.ts: 4 (InMemoryCache interface compliance)"
            echo "   • Total intentional: 200"
            echo ""
            echo "📖 Documentation:"
            echo "   • Quick Reference: docs/01_TYPESCRIPT_PATTERNS.md#eslint-warning-quick-reference"
            echo "   • Complete Guide: docs/LEARNINGS_ESLINT_PRETTIER_CLEANUP_2025.md"
            echo ""
            echo "💡 Next Steps:"
            echo "   1. Run 'npm run lint' locally to see specific warnings"
            echo "   2. Check if warnings are fixable (not in interface compliance files)"
            echo "   3. See the 8 documented patterns in docs/01_TYPESCRIPT_PATTERNS.md"
            echo "   4. If warnings are from new interface methods, document them"
            echo ""
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            exit 1
          fi
        # Ratcheting strategy: Allows current 200 intentional warnings (interface compliance)
        # Fails if warning count increases beyond 250, preventing regression
        # Buffer: 50 warnings allows legitimate interface additions

      - name: Prettier formatting check
        run: npm run format:check
        continue-on-error: true  # Allow until codebase is fully formatted

      - name: TypeScript type checking
        run: npm run check
        continue-on-error: false

      - name: Check for console.log statements
        continue-on-error: true  # Warning only - don't block PRs
        run: |
          echo "Checking for console.log in production code..."
          FOUND=$(git diff origin/${{ github.base_ref }}...HEAD --name-only 2>/dev/null | grep -E '\.(ts|tsx|js|jsx)$' | grep -v '__tests__' | grep -v 'scripts/' | xargs grep -l 'console\.\(log\|debug\|info\)' 2>/dev/null | grep -v 'utils/logger' || true)
          if [ -n "$FOUND" ]; then
            echo "⚠️ Found console.log statements in:"
            echo "$FOUND"
            echo "Consider using the structured logger from utils/logger.ts"
          else
            echo "✅ No console.log statements found"
          fi

      - name: Check for 'any' types
        continue-on-error: true  # Warning only - don't block PRs
        run: |
          echo "Checking for 'any' types in new code..."
          ANY_TYPES=$(git diff origin/${{ github.base_ref }}...HEAD 2>/dev/null | grep "^+" | grep -E ": any[^a-zA-Z]|<any>|any\[\]" | grep -v "catch.*any" | grep -v "// any:" | head -5 || true)
          if [ -n "$ANY_TYPES" ]; then
            echo "⚠️ Found potential 'any' types in new code:"
            echo "$ANY_TYPES"
            echo "Consider using proper TypeScript types instead"
          else
            echo "✅ No 'any' types found in new code"
          fi

  # Job 2: Automated Tests
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: ankane/pgvector:latest
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Setup environment variables
        run: |
          echo "DATABASE_URL=postgresql://postgres:postgres@localhost:5432/test_db" >> $GITHUB_ENV
          echo "REDIS_URL=redis://localhost:6379" >> $GITHUB_ENV
          echo "SESSION_SECRET=$(openssl rand -base64 32)" >> $GITHUB_ENV
          echo "CSRF_SECRET=$(openssl rand -base64 32)" >> $GITHUB_ENV
          echo "ENCRYPTION_KEY=$(openssl rand -hex 32)" >> $GITHUB_ENV
          echo "NODE_ENV=test" >> $GITHUB_ENV

      - name: Install pgvector extension
        run: |
          echo "Creating pgvector extension..."
          PGPASSWORD=postgres psql -h localhost -U postgres -d test_db -c "CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Setup base schema
        run: npm run db:push

      - name: Run database migrations
        run: npm run migrate

      - name: Run test suite with coverage
        run: npm run test:coverage
        env:
          CI: true

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          flags: unittests
          fail_ci_if_error: false

      - name: Upload coverage to Coveralls
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path-to-lcov: ./coverage/lcov.info

      - name: Comment coverage on PR
        uses: romeovs/lcov-reporter-action@v0.3.1
        if: github.event_name == 'pull_request'
        with:
          lcov-file: ./coverage/lcov.info
          github-token: ${{ secrets.GITHUB_TOKEN }}
          delete-old-comments: true

      - name: Archive coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  # Job 3: Security Checks
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run npm audit
        run: npm run security:audit
        continue-on-error: true  # Don't block on upstream vulnerabilities

      - name: Run security test suite
        continue-on-error: true  # Security tests may need database - run separately
        env:
          DATABASE_URL: postgresql://localhost:5432/test_db
          NODE_ENV: test
        run: |
          echo "⚠️ Security tests run in dedicated Security Scanning workflow"
          echo "Skipping here to avoid duplicate runs"

  # Job 4: Build Verification
  build:
    name: Build Verification
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build frontend
        run: npm run build

      - name: Check build output
        run: |
          if [ ! -d "dist" ]; then
            echo "❌ Build directory not found"
            exit 1
          fi
          if [ ! -f "dist/index.js" ]; then
            echo "❌ Server bundle not found"
            exit 1
          fi
          echo "✅ Build successful"

      - name: Archive production artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 3

  # Job 5: Pre-commit Hook Simulation
  pre-commit:
    name: Pre-commit Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Need full history for git diff

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Simulate pre-commit hook
        continue-on-error: true  # Warning only until patterns are refined
        run: |
          echo "Running pre-commit checks..."

          # Get changed files
          CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD 2>/dev/null | grep -E '\.(ts|tsx|js|jsx)$' || true)

          if [ -z "$CHANGED_FILES" ]; then
            echo "✅ No TypeScript/JavaScript files changed"
            exit 0
          fi

          echo "Checking changed files:"
          echo "$CHANGED_FILES"

          WARNINGS=0

          # Check for passwordHash exposure (only in non-comment, non-type-def lines)
          # Skip lines that are comments, type definitions, or documentation
          PASS_EXPOSURE=$(git diff origin/${{ github.base_ref }}...HEAD -- $CHANGED_FILES 2>/dev/null | grep -E "^\+" | grep "passwordHash" | grep -v "^\+.*//.*passwordHash" | grep -v "NEVER" | grep -v "SECURITY:" | grep -v "type.*passwordHash" | grep -v "interface" | head -3 || true)
          if [ -n "$PASS_EXPOSURE" ]; then
            echo "⚠️ WARNING: Potential passwordHash reference detected - please verify it's not exposed"
            echo "$PASS_EXPOSURE"
            WARNINGS=$((WARNINGS + 1))
          fi

          # Check for N+1 queries (simplified - just warn, don't fail)
          N1_PATTERN=$(git diff origin/${{ github.base_ref }}...HEAD -- $CHANGED_FILES 2>/dev/null | grep -E "^\+.*for.*await.*storage\.|^\+.*forEach.*await.*storage\." | head -3 || true)
          if [ -n "$N1_PATTERN" ]; then
            echo "⚠️ WARNING: Potential N+1 query pattern - consider batch operations"
            echo "$N1_PATTERN"
            WARNINGS=$((WARNINGS + 1))
          fi

          if [ $WARNINGS -gt 0 ]; then
            echo ""
            echo "⚠️ Pre-commit checks found $WARNINGS warnings to review"
            echo "These are informational only and won't block the PR"
          else
            echo "✅ All pre-commit checks passed"
          fi

  # Final: All Checks Status
  # Note: E2E tests run in a separate workflow (e2e-tests.yml)
  ci-success:
    name: All Checks Passed
    runs-on: ubuntu-latest
    needs: [quality, test, security, build, pre-commit]
    if: always()

    steps:
      - name: Check critical jobs
        run: |
          # Only require build and test to pass - other checks are advisory
          if [ "${{ needs.build.result }}" != "success" ]; then
            echo "❌ Build failed - this is required"
            exit 1
          fi
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "❌ Tests failed - this is required"
            exit 1
          fi
          
          # Report on other checks
          echo "📊 CI Results Summary:"
          echo "  Build: ${{ needs.build.result }}"
          echo "  Tests: ${{ needs.test.result }}"
          echo "  Quality: ${{ needs.quality.result }} (advisory)"
          echo "  Security: ${{ needs.security.result }} (advisory)"
          echo "  Pre-commit: ${{ needs.pre-commit.result }} (advisory)"
          echo ""
          echo "✅ Required checks passed!"
          echo "ℹ️ E2E tests run in parallel - check the E2E Tests workflow"
