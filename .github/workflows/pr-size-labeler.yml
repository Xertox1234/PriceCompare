name: PR Size Labeler

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  size-label:
    name: Label PR by Size
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Label PR by size
        uses: codelytv/pr-size-labeler@v1
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          xs_label: 'size/XS'
          xs_max_size: 10
          s_label: 'size/S'
          s_max_size: 100
          m_label: 'size/M'
          m_max_size: 500
          l_label: 'size/L'
          l_max_size: 1000
          xl_label: 'size/XL'
          fail_if_xl: false
          message_if_xl: >
            This PR is exceptionally large (>1000 lines changed).
            Consider breaking it into smaller, more reviewable PRs.

            **Benefits of smaller PRs:**
            - Faster review cycles
            - Easier to identify bugs
            - Lower risk of merge conflicts
            - Better for incremental delivery
          files_to_ignore: 'package-lock.json,*.svg,*.png,*.jpg'
