version: '3.8'

services:
  # Main price comparison app
  price-app:
    build: 
      context: .
      dockerfile: Dockerfile.app
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/price_db
      - DISCOURSE_URL=http://discourse:3000
      - DISCOURSE_API_KEY=${DISCOURSE_API_KEY}
      - DISCOURSE_SSO_SECRET=${DISCOURSE_SSO_SECRET}
      - SESSION_SECRET=${SESSION_SECRET}
      - REDIS_URL=redis://redis:6379
      - NODE_ENV=production
    depends_on:
      - postgres
      - redis
    networks:
      - app-network
    volumes:
      - ./shared-styles.css:/app/shared-styles.css

  # Discourse forum
  discourse:
    image: discourse/discourse:latest
    ports:
      - "3000:80"
    environment:
      - DISCOURSE_HOSTNAME=localhost:3000
      - DISCOURSE_DB_HOST=postgres
      - DISCOURSE_DB_NAME=discourse_db
      - DISCOURSE_DB_USERNAME=discourse_user
      - DISCOURSE_DB_PASSWORD=${DISCOURSE_DB_PASSWORD}
      - DISCOURSE_REDIS_HOST=redis
      - DISCOURSE_REDIS_PORT=6379
      - DISCOURSE_SMTP_ADDRESS=${SMTP_ADDRESS}
      - DISCOURSE_SMTP_PORT=${SMTP_PORT}
      - DISCOURSE_SMTP_USER_NAME=${SMTP_USERNAME}
      - DISCOURSE_SMTP_PASSWORD=${SMTP_PASSWORD}
      # SSO Configuration
      - DISCOURSE_SSO_URL=http://price-app:5000/discourse/sso
      - DISCOURSE_SSO_SECRET=${DISCOURSE_SSO_SECRET}
      - DISCOURSE_ENABLE_SSO=true
      - DISCOURSE_SSO_OVERRIDES_EMAIL=true
      - DISCOURSE_SSO_OVERRIDES_USERNAME=true
      - DISCOURSE_SSO_OVERRIDES_NAME=true
      # Additional settings
      - DISCOURSE_DEVELOPER_EMAILS=${ADMIN_EMAIL}
      - DISCOURSE_SMTP_ENABLE_START_TLS=true
      - DISCOURSE_SMTP_AUTHENTICATION=plain
      - DISCOURSE_SMTP_OPENSSL_VERIFY_MODE=none
    depends_on:
      - postgres
      - redis
    volumes:
      - discourse-uploads:/var/www/discourse/public/uploads
      - discourse-backups:/var/www/discourse/public/backups
      - ./discourse-theme:/var/www/discourse/app/assets/stylesheets/custom
    networks:
      - app-network

  # Shared PostgreSQL
  postgres:
    image: postgres:15
    environment:
      - POSTGRES_DB=price_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - app-network
    ports:
      - "5432:5432"

  # Redis for sessions and Discourse
  redis:
    image: redis:7-alpine
    networks:
      - app-network
    ports:
      - "6379:6379"

  # Nginx reverse proxy
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./ssl:/etc/nginx/ssl
    depends_on:
      - price-app
      - discourse
    networks:
      - app-network

volumes:
  postgres-data:
  discourse-uploads:
  discourse-backups:

networks:
  app-network:
    driver: bridge