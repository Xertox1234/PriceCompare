# Grafana Dashboard Provisioning
# Auto-loads dashboards from the specified directory

apiVersion: 1

providers:
  - name: 'Price Aggregation Dashboards'
    orgId: 1
    folder: 'PriceCompare'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: true
