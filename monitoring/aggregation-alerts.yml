# Prometheus Alert Rules for Price Aggregation System
#
# These rules monitor the health and performance of price aggregation operations
# and trigger alerts when issues are detected.

groups:
  # ============================================
  # Aggregation Health & Success Rate
  # ============================================
  - name: aggregation_health
    interval: 30s
    rules:
      # Alert when success rate drops below 95%
      - alert: AggregationSuccessRateLow
        expr: |
          (
            sum(rate(aggregation_success_total[5m])) by (operation)
            /
            (
              sum(rate(aggregation_success_total[5m])) by (operation)
              +
              sum(rate(aggregation_failure_total[5m])) by (operation)
            )
          ) < 0.95
        for: 5m
        labels:
          severity: warning
          component: aggregation
          service: price-compare
          alert_type: success_rate
        annotations:
          summary: "Low success rate for {{ $labels.operation }} aggregation"
          description: |
            The {{ $labels.operation }} aggregation operation has a success rate of {{ $value | humanizePercentage }}
            over the last 5 minutes. This is below the 95% threshold.

            Current success rate: {{ $value | humanizePercentage }}
            Threshold: 95%

            Check logs for error details and investigate failed operations.
          runbook_url: "https://docs.pricecompare.example.com/runbooks/aggregation-success-rate-low"

      # Alert when NO successful aggregations in 25 hours (critical - data staleness)
      - alert: AggregationStalled
        expr: |
          (time() - aggregation_success_total > 90000)
          or
          (increase(aggregation_success_total[25h]) == 0)
        for: 1h
        labels:
          severity: critical
          component: aggregation
          service: price-compare
          alert_type: data_staleness
        annotations:
          summary: "CRITICAL: {{ $labels.operation }} aggregation has stalled"
          description: |
            The {{ $labels.operation }} aggregation has not completed successfully in over 25 hours.
            This indicates a critical failure in the aggregation pipeline.

            Last successful aggregation: More than 25 hours ago
            Expected frequency: Daily (24 hours)

            IMMEDIATE ACTION REQUIRED:
            1. Check application logs for errors
            2. Verify database connectivity
            3. Check job queue status
            4. Verify Redis distributed locks are not stuck
            5. Manual trigger may be required

            Users are seeing stale price data!
          runbook_url: "https://docs.pricecompare.example.com/runbooks/aggregation-stalled"

  # ============================================
  # Aggregation Performance
  # ============================================
  - name: aggregation_performance
    interval: 30s
    rules:
      # Alert when average operation duration exceeds 60 seconds
      - alert: AggregationOperationsSlow
        expr: |
          aggregation_duration_seconds{quantile="avg"} > 60
        for: 10m
        labels:
          severity: warning
          component: aggregation
          service: price-compare
          alert_type: performance
        annotations:
          summary: "{{ $labels.operation }} aggregations are running slow"
          description: |
            The {{ $labels.operation }} aggregation operations are taking an average of {{ $value }}s
            to complete, which exceeds the 60s threshold.

            Current average duration: {{ $value }}s
            Threshold: 60s

            Possible causes:
            - Database performance degradation
            - Increased data volume
            - Resource contention
            - Network issues

            Check database query performance and system resources.
          runbook_url: "https://docs.pricecompare.example.com/runbooks/aggregation-slow"

      # Alert when max duration is extremely high (> 300s = 5 minutes)
      - alert: AggregationOperationsTimeout
        expr: |
          aggregation_duration_seconds{quantile="max"} > 300
        for: 5m
        labels:
          severity: critical
          component: aggregation
          service: price-compare
          alert_type: performance
        annotations:
          summary: "{{ $labels.operation }} aggregation operations timing out"
          description: |
            The maximum duration for {{ $labels.operation }} aggregation operations has exceeded 5 minutes.

            Max duration: {{ $value }}s ({{ $value | humanizeDuration }})
            Threshold: 300s (5 minutes)

            This suggests serious performance issues or hanging operations.
            Immediate investigation required.
          runbook_url: "https://docs.pricecompare.example.com/runbooks/aggregation-timeout"

  # ============================================
  # Data Quality & Record Counts
  # ============================================
  - name: aggregation_data_quality
    interval: 1m
    rules:
      # Alert when record count drops significantly (> 50% decrease)
      - alert: AggregationRecordCountAnomaly
        expr: |
          (
            aggregation_records_total
            /
            avg_over_time(aggregation_records_total[7d])
          ) < 0.5
        for: 15m
        labels:
          severity: warning
          component: aggregation
          service: price-compare
          alert_type: data_quality
        annotations:
          summary: "{{ $labels.operation }} aggregation processing fewer records than normal"
          description: |
            The {{ $labels.operation }} aggregation is processing significantly fewer records than the 7-day average.

            Current record count is {{ $value | humanizePercentage }} of the historical average.
            This may indicate:
            - Data pipeline issues
            - Missing source data
            - Query errors filtering too many records
            - Data quality problems

            Investigate data sources and aggregation logic.
          runbook_url: "https://docs.pricecompare.example.com/runbooks/aggregation-record-anomaly"

      # Alert when NO records are being aggregated
      - alert: AggregationNoRecordsProcessed
        expr: |
          increase(aggregation_records_total[1h]) == 0
        for: 2h
        labels:
          severity: critical
          component: aggregation
          service: price-compare
          alert_type: data_quality
        annotations:
          summary: "CRITICAL: {{ $labels.operation }} aggregation processing zero records"
          description: |
            The {{ $labels.operation }} aggregation has not processed any records in the last 2 hours.

            This indicates a critical data pipeline failure.

            Possible causes:
            - Empty source tables
            - Query errors
            - Data pipeline broken
            - Date range miscalculation

            IMMEDIATE ACTION REQUIRED to restore data flow.
          runbook_url: "https://docs.pricecompare.example.com/runbooks/aggregation-no-records"

  # ============================================
  # Failure Rate & Error Tracking
  # ============================================
  - name: aggregation_failures
    interval: 30s
    rules:
      # Alert when failure rate is high
      - alert: AggregationHighFailureRate
        expr: |
          (
            sum(rate(aggregation_failure_total[10m])) by (operation)
            /
            (
              sum(rate(aggregation_success_total[10m])) by (operation)
              +
              sum(rate(aggregation_failure_total[10m])) by (operation)
            )
          ) > 0.10
        for: 10m
        labels:
          severity: critical
          component: aggregation
          service: price-compare
          alert_type: failure_rate
        annotations:
          summary: "High failure rate for {{ $labels.operation }} aggregation"
          description: |
            The {{ $labels.operation }} aggregation is experiencing a failure rate of {{ $value | humanizePercentage }}
            over the last 10 minutes.

            Current failure rate: {{ $value | humanizePercentage }}
            Threshold: 10%

            This indicates systematic issues with the aggregation process.
            Check error logs immediately.
          runbook_url: "https://docs.pricecompare.example.com/runbooks/aggregation-high-failures"

      # Alert when failures are consistently occurring
      - alert: AggregationConsistentFailures
        expr: |
          increase(aggregation_failure_total[30m]) >= 3
        for: 5m
        labels:
          severity: warning
          component: aggregation
          service: price-compare
          alert_type: failure_rate
        annotations:
          summary: "{{ $labels.operation }} aggregation experiencing repeated failures"
          description: |
            The {{ $labels.operation }} aggregation has failed {{ $value }} times in the last 30 minutes.

            While not yet critical, this pattern suggests an underlying issue that needs investigation.

            Check recent error logs and metrics for patterns.
          runbook_url: "https://docs.pricecompare.example.com/runbooks/aggregation-consistent-failures"

  # ============================================
  # Retry & Recovery Monitoring
  # ============================================
  - name: aggregation_retry
    interval: 1m
    rules:
      # Alert when retry rate is high (would need retry metrics exposed)
      # This is a placeholder - implement if retry metrics are added
      - alert: AggregationHighRetryRate
        expr: |
          (
            sum(rate(aggregation_retry_total[15m])) by (operation)
            /
            sum(rate(aggregation_total[15m])) by (operation)
          ) > 0.10
        for: 15m
        labels:
          severity: warning
          component: aggregation
          service: price-compare
          alert_type: retry_rate
        annotations:
          summary: "{{ $labels.operation }} aggregation experiencing high retry rate"
          description: |
            The {{ $labels.operation }} aggregation is retrying more than 10% of operations.

            Current retry rate: {{ $value | humanizePercentage }}
            Threshold: 10%

            High retry rates indicate transient issues:
            - Database connection timeouts
            - Distributed lock contention
            - Network instability
            - Resource exhaustion

            Monitor for escalation to failures.
          runbook_url: "https://docs.pricecompare.example.com/runbooks/aggregation-high-retries"

  # ============================================
  # System Resource Alerts
  # ============================================
  - name: aggregation_resources
    interval: 1m
    rules:
      # Alert when aggregation operations are queued/pending
      # This would require exposing queue depth metrics
      - alert: AggregationQueueBacklog
        expr: |
          aggregation_queue_depth > 10
        for: 30m
        labels:
          severity: warning
          component: aggregation
          service: price-compare
          alert_type: resource
        annotations:
          summary: "{{ $labels.operation }} aggregation queue has backlog"
          description: |
            The {{ $labels.operation }} aggregation queue has {{ $value }} pending operations.

            This suggests the system cannot keep up with the aggregation workload.

            Possible actions:
            - Scale aggregation workers
            - Optimize aggregation queries
            - Reduce aggregation frequency
            - Investigate resource constraints
          runbook_url: "https://docs.pricecompare.example.com/runbooks/aggregation-queue-backlog"

  # ============================================
  # Data Gaps Detection
  # ============================================
  - name: aggregation_gaps
    interval: 5m
    rules:
      # Alert if gaps are detected via health endpoint
      # This requires custom metric from health check
      - alert: AggregationGapsDetected
        expr: |
          aggregation_health_warnings > 0
        for: 10m
        labels:
          severity: warning
          component: aggregation
          service: price-compare
          alert_type: data_quality
        annotations:
          summary: "Data gaps detected in {{ $labels.operation }} aggregation"
          description: |
            The health check has detected {{ $value }} warnings for {{ $labels.operation }} aggregation.

            This may indicate:
            - Missing data for certain time periods
            - Incomplete aggregations
            - Data quality issues

            Check the /api/aggregation-metrics/health endpoint for detailed warnings.
          runbook_url: "https://docs.pricecompare.example.com/runbooks/aggregation-gaps"
