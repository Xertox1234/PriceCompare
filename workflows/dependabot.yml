# Dependabot Configuration
# Automatically creates PRs for dependency updates
# Move this file to .github/dependabot.yml when enabling CI/CD

version: 2
updates:
  # NPM dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    reviewers:
      - "Xertox1234"  # Replace with your GitHub username
    labels:
      - "dependencies"
      - "automated"

    # Group updates
    groups:
      # Security updates (auto-merge candidates)
      security-updates:
        dependency-type: "production"
        update-types: ["patch"]
        patterns:
          - "*"

      # Development dependencies
      dev-dependencies:
        dependency-type: "development"
        update-types: ["minor", "patch"]

      # Major version updates (require manual review)
      major-updates:
        update-types: ["major"]

    # Ignore specific dependencies
    ignore:
      # Pin esbuild due to CVE override in package.json
      - dependency-name: "esbuild"
        update-types: ["version-update:semver-major"]

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "10:00"
      timezone: "UTC"
    labels:
      - "github-actions"
      - "automated"
    reviewers:
      - "Xertox1234"

  # Docker
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "11:00"
      timezone: "UTC"
    labels:
      - "docker"
      - "automated"
    reviewers:
      - "Xertox1234"

# Auto-merge strategy (requires additional GitHub Actions workflow)
# See: .github/workflows/dependabot-auto-merge.yml
